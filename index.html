<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Web Sederhana</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #333;
    }

    p {
      color: #555;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #008cba;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #005f5f;
    }
  </style>
</head>
<body>

  <h1>Selamat Datang di Web Saya</h1>
  <p>Ini adalah contoh halaman web sederhana menggunakan HTML dan CSS.</p>
  <button onclick="alert('Tombol ditekan!')">Klik Saya</button>

</body>
</html>
